type Query {
    client(id: ID!): Client
}

type PersonalData {
    name: String!
    age: Int!
}

type Client {
    id: ID!
    data: PersonalData!
    documents: [Document]
    relatives: [Relative]
}

type Document {
    id: ID!
    type: String!
    number: String!
    issueDate: String!
    expiryDate: String!
}

type Relative {
    id: ID!
    data: PersonalData!
    relationType: String!
}
